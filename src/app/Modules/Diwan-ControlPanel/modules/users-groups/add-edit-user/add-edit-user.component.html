<app-modal [display]="display" (displayChange)="onHide()" [title]="header|translate" class="modal-md">
    <div class="block" body>
        <form #form="ngForm" >
            <app-loading *ngIf="loading"></app-loading>

            <div  *ngIf="!loading" class="block">
                <app-find-user [(ngModel)]="user" name="User" [required]="true"
                [title]="'User'|translate"></app-find-user>
            </div>
 
        </form>
      
    </div>
    <div footer>
        <button pButton pRipple type="button" label="{{'Cancel'|translate}}" icon='pi pi-times {{"css.mr-2"|translate}}'
            (click)="onHide()" class="p-button-secondary p-button-outlined"></button>

        <button pButton pRipple type="button" label="{{'Save'|translate}}" [disabled]="form?.invalid"
            (click)="addUser()" icon='pi pi-check {{"css.mr-2"|translate}}'></button>

    </div>
</app-modal>
