<app-loading *ngIf="loading"></app-loading>

<div *ngIf="!loading" class="grid mt-1 ">
    <div class="col-6 pb-1" *ngFor="let claim of claims">
        <div class="flex ">
            <p-inputSwitch [(ngModel)]="claim.value" (ngModelChange)="activeDeactiveClaim(claim)"
                styleClass="inputSwitch-sm"></p-inputSwitch>
            <div class=" font-semibold text-base my-1 mx-2">{{claim?.description}}</div>
        </div>
    </div>
</div>
