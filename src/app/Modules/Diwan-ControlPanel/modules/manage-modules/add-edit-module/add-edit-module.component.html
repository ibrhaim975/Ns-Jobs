<app-modal [display]="display" (displayChange)="onHide()" [title]="header|translate" class="modal-md">
    <div class="block" body>
        <form #form="ngForm" >
            <app-loading *ngIf="loading"></app-loading>

            <div *ngIf="!loading" class="grid ">
                <div class=" lg:col-6  sm:col-12">
                    <app-input [(ngModel)]="module.name.en" name="titleEn" [title]="'English Title'|translate"
                        [required]="true"></app-input>
                </div>
                <div class=" lg:col-6  sm:col-12">
                    <app-input [(ngModel)]="module.name.ar" name="titleAr" [title]="'Arabic Title'|translate"
                        [required]="true"></app-input>
                </div>
                <div class=" lg:col-6  sm:col-12">
                    <app-icon-picker [(ngModel)]="module.icon" name="icon" ></app-icon-picker>

                </div>
                 <!-- <div class=" lg:col-6  sm:col-12">
                    <div class="text-lg font-semibold mb-2" translate>Is Active
                    </div>
                    <p-inputSwitch [(ngModel)]="module.isActive" name="isActive"></p-inputSwitch>

                </div>  -->
              
               
            </div>

        </form>
      
    </div>
    <div footer>
        <button pButton pRipple type="button" label="{{'Cancel'|translate}}" icon='pi pi-times {{"css.mr-2"|translate}}'
            (click)="onHide()" class="p-button-secondary p-button-outlined {{'css.pl-2'|translate}}"></button>

        <button pButton pRipple type="button" label="{{'Save'|translate}}" [disabled]="form?.invalid"
            (click)="addEditModule()" icon='pi pi-check {{"css.mr-2"|translate}}' class="{{'css.pl-2'|translate}}"></button>

    </div>
</app-modal>
