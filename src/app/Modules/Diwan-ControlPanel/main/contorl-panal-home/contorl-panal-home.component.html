<app-breadcrumb [data]="breadcrumb"></app-breadcrumb>

<div class="grid pt-2">
    <div class=" md:col-12 md:col-4 lg:col-2 ">
        <ng-container *ngIf="!loading">
            <p-panelMenu #panelMenu [model]="items" (click)="activeMenu($event)"
                [styleClass]="currentLang=='en'?'ContorlPanal-menu':'ContorlPanal-menu iconMenu-ar'"></p-panelMenu>
                
        </ng-container>
    </div>
    <div class="sm-col-12 md:col-8 lg:col-10">
        <div class="card p-0  ">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<div *ngIf="displayAddEditModule">
    <app-add-edit-module [(display)]="displayAddEditModule"></app-add-edit-module>
</div>
