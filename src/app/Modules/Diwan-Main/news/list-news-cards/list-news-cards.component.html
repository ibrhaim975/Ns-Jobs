<div class="grid mt-2">
    <div *ngFor="let item of dashboard?.dashboardHeader" class="lg:col-2card sm:col-6">
        <app-card-colored [color]='item?.color' (click)="onDataSelect({type:item?.type,filed:item?.filed},item?.id)">
            <div body>
                <div style="justify-content: unset !important;" class="flex ">
                    <div class="mt-2">
                        <div style="max-width: 50px;max-height: 50px;" class="relative "
                            [style.background-color]="hexToRGB(item?.color,0.1)"
                            [style.color]="hexToRGB(item?.color,0.8)">
                            <i class="p-2 m-1 text-3xl" [style.color]="item?.color" [class]="item?.icon"></i>
                        </div>
                    </div>
                    <div class="block">
                        <div class="mx-4 text-3xl font-bold">{{item?.count}}</div>
                        <div class="mx-4 text-lg text-500 font-bold" translate>{{item?.name}}
                        </div>
                    </div>
                    
                </div>
            </div>
        </app-card-colored>
    </div>


    <div class="col-12">
        <div class="card p-0">

            <div class="block px-3 pt-2">
                <div class=" text-4xl font-bold">{{news?.newsCoveragePercentagePerAgency?.totalAgencies}}</div>
                <div class=" text-xl text-500 font-bold" translate>Agencies</div>
            </div>
            <p-divider></p-divider>
            <div class="px-3">
                <div class="pt-1 pb-3">
                    <label class="text-3xl font-semibold">The news coverage Per/Agencies</label>
                </div>
                
                <p-chart #newsCoveragePercentagePerAgency type="bar" [data]="dashboard?.newsCoveragePercentagePerAgency" [height]="350"
        
                    [options]="dashboard['chartOptions']"></p-chart>


            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="card p-0">

            <div class="block px-3 pt-2">
                <div class=" text-4xl font-bold">500</div>
                <div class=" text-xl text-500 font-bold" translate>Keywords</div>
            </div>
            <p-divider></p-divider>
            <div class="px-3">
                <div class="pt-1 pb-3">
                    <label class="text-3xl font-semibold">Most Popular Keywords</label>
                </div>
           
            <img src="https://i.ibb.co/fC13QkZ/Screenshot-333.png" width="100%" alt="">    
            
            </div>
        </div>
    </div>
   

</div>
