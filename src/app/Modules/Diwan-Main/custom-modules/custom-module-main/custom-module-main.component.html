<app-breadcrumb [data]="breadcrumb"></app-breadcrumb>
<p-toast position="top-right"></p-toast>
<p-confirmDialog appendTo="body"></p-confirmDialog>

<div class="flex justify-content-between flex-wrap mb-2">
    <div class="flex align-items-center justify-content-center  ">

        <i [class]="currentModule?.icon" class="  text-primary text-3xl"></i>
        <span class="mx-3 font-semibold text-3xl" >{{currentModule?.name}}</span>
    </div>
    <div class="flex align-items-center justify-content-center  ">

        <div class="flex align-items-center justify-content-center m-2 dir-int">
            <p-selectButton [options]="[{label: 'Me', value: 'off'}, {label: 'Ceo', value: 'on'}]" optionLabel="label"
                optionValue="value"></p-selectButton>
        </div>
        <div class="flex align-items-center justify-content-center m-2 border-break">

        </div>
        <div class="flex align-items-center justify-content-center m-2 ">
            <button pButton pRipple type="button" icon="pi pi pi-users text-lg"
                class="p-button-rounded p-button-outlined p-button-secondary2 "></button>
        </div>
        <div class="flex align-items-center justify-content-center m-2 ">
            <button pButton pRipple type="button" icon="pi pi pi-bars "
                class="p-button-rounded p-button-outlined p-button-secondary2 "></button>

        </div>

        <div class="flex align-items-center justify-content-center m-2">
            <button pButton pRipple type="button" icon="pi pi pi-th-large "
                class="p-button-rounded p-button-outlined p-button-secondary2 "></button>
        </div>
        <div class="flex align-items-center justify-content-center  m-2 ">
            <button pButton pRipple type="button" icon="pi pi-filter-fill "
                class="p-button-rounded p-button-outlined p-button-secondary2 "></button>

        </div>

        <div class="flex align-items-center justify-content-center m-2 ">
            <button pButton pRipple type="button" icon="pi pi pi-plus " (click)="initSelectedEntry();showAddEdit()" label="{{'New'| translate}} {{currentModule?.name}}"
                class="p-button-rounded p-button-outlined p-button-secondary2 text-btn"></button>

        </div>

    </div>
</div>
<div class="card mt-3">
    <app-table #table [caption]="caption" [data]="data" [columns]="columns" [actionsColumns]="actionsColumns"
        [reorderableColumns]="false" [actionsTemplate]="{action:action}" [lodaing]="loading">


        <ng-template #action>
            <button (mouseenter)="setSelectedEntry(table?.selectedItem)" (click)="menu.toggle($event)" pButton pRipple type="button" icon="pi pi-ellipsis-v font-semibold"
                class="p-button-rounded p-button-secondary p-button-text  "></button>
            <p-menu #menu [popup]="true" appendTo="body" [model]="moduleActions"></p-menu>
        </ng-template>
    </app-table>
</div>
<ng-container *ngIf="displayAddEdit">
    <app-add-edit-custom-module [(display)]="displayAddEdit"></app-add-edit-custom-module>
</ng-container>

<ng-container *ngIf="displayDetails">
    <app-custom-module-details [(display)]="displayDetails"></app-custom-module-details>
</ng-container>
