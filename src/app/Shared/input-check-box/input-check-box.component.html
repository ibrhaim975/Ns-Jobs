




<div class="block">

    <div class="text-lg font-semibold mb-2" >{{title}}
        <span *ngIf="required && !value" style="color: var(--danger) !important">*</span>
    </div>
    <p-checkbox 
    [(ngModel)]="value" [class]="class" [required]="required" type="text"  [name]="title"
    [binary]="true" inputId="binary"></p-checkbox>

</div>
