<div class="relative">
    <div #body class=" surface-50 overflow-y-auto" [style.height]="height">
        <div class="p-3">
            <div *ngFor="let comment of comments" class="mb-3">
                <ng-container #user>
                    <div class="flex">

                        <p-avatar [image]="comment?.createdBy?.photo||'./assets/images/user.png'"
                            styleClass="m-2 avater" shape="circle"></p-avatar>
                        <div class="mt-2">
                            <div class="mb-1 font-semibold">{{comment?.createdBy?.displayName}}</div>
                            <div class=" text-500" translate>{{comment?.createdAt?.label }}</div>
                        </div>
                    </div>
                </ng-container>
                <ng-container #comments>
                    <div class="mx-7">
                        <p class="font-semibold my-1">
                            {{comment?.body}}
                        </p>
                        <div class="flex flex-wrap column-gap-4 row-gap-4 mt-2">
                            <div *ngFor="let attachment of comment?.attachments" (click)="downloadFile(attachment)"
                                class=" cursor-pointer w-max  flex align-items-center justify-content-center comment-attachment border-round comment-attachment p-2 "
                                pTooltip="{{'Download'|translate}}  {{'File'|translate}}">
                                <img src="./assets//files/{{getFileType(attachment?.name)}}.png" width="32"
                                    alt="">
                                <span class=" mx-1 ">{{attachment?.name}}</span>


                            </div>

                        </div>

                    </div>
                </ng-container>
            </div>

        </div>

    </div>

    <div #commentsInput class="comments-input-contanier relative ">
        <div class="absolute bg-white bottom-100 w-12">
            <div #attachmentViewer *ngIf="newAttachments?.length"
                class="flex flex-wrap column-gap-4 row-gap-4 border-bottom p-2">
                <div *ngFor="let attachment of newAttachments;let i=index" style="background-color: var(--blue-100)"
                    class="w-max  flex align-items-center justify-content-center p-1 border-round">
                    <img src="./assets/icons/custom/files/{{getFileType(attachment?.name)}}.png" width="32" alt="">
                    <span class=" mx-1 ">{{attachment?.name}}</span>
                    <button pButton pRipple type="button" icon="pi pi-times" (click)="removeAttachment(i)"
                        class="p-button-rounded p-button-danger p-button-text p-button-sm"></button>
                </div>

            </div>
        </div>
        <div class="border-bottom">
            <textarea placeholder="{{'Write an Update'|translate}}" [(ngModel)]="newComment" rows="6"
                class="comments-input " [style.width.px]="body.offsetWidth" pInputTextarea
                [autoResize]="true"></textarea>
        </div>
        <div class="flex justify-content-between flex-wrap card-container purple-container p-2">
            <div class="flex align-items-center justify-content-center ">

                <button pButton pRipple type="button" icon="fa-solid fa-at text-lg "
                    class="p-button-rounded p-button-secondary p-button-text"></button>



                <!-- // upload file  -->
                <button *ngIf="(workflowComment==true && newAttachments?.length != 1) || workflowComment==false" pButton
                    pRipple type="button" (click)="uploadfile?.click()"
                    [icon]="loading==true?'pi pi-spin pi-spinner text-lg':'pi pi-paperclip text-lg'"
                    [disabled]="loading" class="p-button-rounded p-button-secondary p-button-text"></button>


                <input #uploadfile multiple accept="{{fileTypes}}" name="attachments"
                    (change)="handleFileInput($event.target.files)" style="display:none" type="file"
                    class="file-upload">



            </div>
            <div class="flex align-items-center justify-content-center">
                <button pButton pRipple type="button" icon="pi pi-send" [disabled]="!newComment"
                    (click)="submbitComments()" class="p-button-rounded p-button-text p-button-lg"></button>

            </div>


        </div>
    </div>
</div>
