

<div class="block">

    <div class="text-lg font-semibold mb-2" >{{title}}
        <span *ngIf="required && !value" style="color: var(--danger) !important">*</span>
    </div>
    <p-inputNumber [(ngModel)]="value" [max]="max" [class]="class" [required]="required" type="text" placeholder="{{'Enter'|translate}} {{title}}" [name]="title"></p-inputNumber>

</div>
